name: Builds

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  # ===========================================================================
  # macOS: CLAP, VST3, AU, standalone app (Universal: arm64 + x86_64)
  # ===========================================================================
  build-macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Build (universal)
        run: make all ARCHFLAGS="-arch arm64 -arch x86_64"

      - name: Test
        run: make test ARCHFLAGS="-arch arm64 -arch x86_64"

      - name: Package
        run: |
          lipo -info build/electropiano.clap/Contents/MacOS/electropiano
          mkdir -p dist
          cp -R build/electropiano.clap build/electropiano.vst3 build/electropiano.component build/electropiano.app dist/
          cp README.md LICENSE dist/
          cp docs/MANUAL.md dist/MANUAL.md
          cd dist && ditto -c -k --sequesterRsrc . ../electropiano-v0.77-macOS-Universal.zip

      - uses: actions/upload-artifact@v4
        with:
          name: electropiano-macOS
          path: electropiano-v0.77-macOS-Universal.zip

  # ===========================================================================
  # Windows: CLAP, VST3 (x64)
  # ===========================================================================
  build-windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -G "Visual Studio 17 2022" -A x64

      - name: Build
        run: cmake --build build --config Release --target electropiano_CLAP electropiano_VST3 test_phs_piano test_wurli_port

      - name: Test
        run: |
          ./build/Release/test_wurli_port.exe
          ./build/Release/test_phs_piano.exe

      - name: Package
        shell: bash
        run: |
          mkdir -p dist/electropiano.vst3/Contents/x86_64-win
          cp build/Release/electropiano.clap dist/
          cp build/Release/electropiano.vst3 dist/electropiano.vst3/Contents/x86_64-win/electropiano.vst3
          cp README.md LICENSE dist/
          cp docs/MANUAL.md dist/MANUAL.md
          cd dist && 7z a ../electropiano-v0.77-Windows-x64.zip *

      - uses: actions/upload-artifact@v4
        with:
          name: electropiano-Windows
          path: electropiano-v0.77-Windows-x64.zip

  # ===========================================================================
  # Linux: CLAP, VST3 (x64, X11)
  # ===========================================================================
  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --target electropiano_CLAP electropiano_VST3 test_phs_piano test_wurli_port -j$(nproc)

      - name: Test
        run: |
          ./build/test_wurli_port
          ./build/test_phs_piano

      - name: Package
        run: |
          mkdir -p dist/electropiano.vst3/Contents/x86_64-linux
          cp build/electropiano.clap dist/
          cp build/electropiano.vst3 dist/electropiano.vst3/Contents/x86_64-linux/electropiano.so
          cp README.md LICENSE dist/
          cp docs/MANUAL.md dist/MANUAL.md
          tar -czf electropiano-v0.77-Linux-x64.tar.gz -C dist .

      - uses: actions/upload-artifact@v4
        with:
          name: electropiano-Linux
          path: electropiano-v0.77-Linux-x64.tar.gz

  # ===========================================================================
  # GitHub Release for version tags
  # ===========================================================================
  release:
    needs: [build-macos, build-windows, build-linux]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          name: electropiano ${{ github.ref_name }}
          body_path: docs/RELEASE_NOTES.md
          files: artifacts/*
